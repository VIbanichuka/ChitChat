<div style="margin-left: 10px; margin-top: 10px; margin-right: 10px; padding-left: 100px; padding-right: 100px">

    <div style="flex-grow: 1; display: flex; justify-content: center; align-items: center;">
        <div style="position: relative; width: 100%; max-width: 600px;">
            <mat-icon style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: gray;">
                search
            </mat-icon>
            <input cdkOverlayOrigin #overlayPosition="cdkOverlayOrigin" placeholder="Search for friends" type="search"
                [(ngModel)]="searchQuery" (ngModelChange)="searchFriends()"
                style="width: 100%; height: 35px; padding-left: 50px; padding-right: 15px; border-radius: 5px; border: 1px solid #ddd; font-size: 12px;" />
        </div>
    </div>

    <h2>Friends</h2>

    <div *ngFor="let friend of friends">
        <mat-card class="card-container" (click)="openUserHubDialog(friend)">
            <img style="background-size: cover; max-width: 150px; width: 100%; height: 100%; max-height: 150px;"
                mat-card-image src="../assets/{{friend?.profilePicture || 'photo.jpg'}}" />
            <mat-card-content>
                <div class="card-content">
                    <mat-card-title>{{friend?.displayName}}</mat-card-title>
                    <mat-card-subtitle></mat-card-subtitle>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <div *ngIf="!friends || friends.length === 0">
        <mat-card>
            <mat-card-content>
                <div style="display:flex; justify-content: center; align-content: center;">
                    <img matListAvatar src="../assets/{{'photo3.png'}}"
                        style="height: 100%; max-height: 400px; width: 100%; max-width: 400px" />
                </div>
                <mat-card-title>You have no friends...</mat-card-title>
            </mat-card-content>
        </mat-card>

    </div>

</div>


<ng-template cdk-connected-overlay [cdkConnectedOverlayOrigin]="overlayPosition" [cdkConnectedOverlayOpen]="overlayOpen"
    [cdkConnectedOverlayWidth]="overlayPosition.elementRef.nativeElement.offsetWidth"
    (overlayOutsideClick)="closeOverlay()">
    <div class="overlay-container">
        <mat-divider></mat-divider>
        <mat-action-list>
            <mat-list-item *ngFor="let friend of filteredFriends" (click)="openUserHubDialog(friend)">

                <div style="display: flex; align-items: center; width: 100%; justify-content:left;">
                    <img matListAvatar src="../assets/{{friend?.profilePicture || 'photo.jpg'}}"
                        style=" padding: 0; margin-right: 10px; width: 40px; height: 40px; border-radius: 50%;">
                    <h3 style=" font-weight: 500; margin:0px; padding: 0px;">{{ friend.displayName }}</h3>
                </div>
            </mat-list-item>
        </mat-action-list>
    </div>
</ng-template>
